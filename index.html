<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #2ea043;
    --accent-hover: #3fb950;
    --danger: #f85149;
    --input-bg: #0d1117;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 680px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    min-height: 70px;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    padding: 11px 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.danger {
    background: #3a1618;
    border: 1px solid var(--danger);
    color: #ffa198;
  }
  button.danger:hover { background: #4a1c1f; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-row button { flex: 1; }
  #notesList {
    list-style: none;
    margin: 22px 0 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #notesList li {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  #notesList .note-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.5;
  }
  #notesList .note-date {
    color: var(--muted);
    font-size: 11.5px;
    margin-top: 4px;
  }
  #notesList button.del {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--danger);
    padding: 6px 10px;
    margin: 0;
    font-size: 12px;
    flex-shrink: 0;
  }
  #notesList button.del:hover { background: #2d1214; }
  .empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px 0;
  }
</style>
</head>
<body>

<div class="card" id="app">
  <h1>📝 Notes</h1>
  <div class="subtitle">Maglagay ng note sa ibaba, pwede maraming notes. Naka-save automatic sa browser mo.</div>

  <textarea id="noteInput" placeholder="Isulat ang note dito..."></textarea>
  <div class="btn-row">
    <button type="button" id="addBtn">➕ Idagdag ang Note</button>
    <button type="button" id="deleteAllBtn" class="danger">🗑️ Burahin Lahat</button>
  </div>

  <ul id="notesList"></ul>
</div>

<script>
const $ = id => document.getElementById(id);
const listEl = $('notesList');
const inputEl = $('noteInput');

function loadNotes() {
  try {
    return JSON.parse(localStorage.getItem('notes') || '[]');
  } catch (e) {
    return [];
  }
}

function saveNotes(notes) {
  localStorage.setItem('notes', JSON.stringify(notes));
}

function render() {
  const notes = loadNotes();
  listEl.innerHTML = '';
  if (notes.length === 0) {
    listEl.innerHTML = '<div class="empty">Wala pang note. Magdagdag sa itaas.</div>';
    return;
  }
  notes.slice().reverse().forEach(note => {
    const li = document.createElement('li');
    const date = new Date(note.created).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
    li.innerHTML = `
      <div>
        <div class="note-text"></div>
        <div class="note-date">${date}</div>
      </div>
      <button type="button" class="del">🗑️</button>
    `;
    li.querySelector('.note-text').textContent = note.text;
    li.querySelector('.del').addEventListener('click', () => {
      const remaining = loadNotes().filter(n => n.id !== note.id);
      saveNotes(remaining);
      render();
    });
    listEl.appendChild(li);
  });
}

$('addBtn').addEventListener('click', () => {
  const text = inputEl.value.trim();
  if (!text) return;
  const notes = loadNotes();
  notes.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2), text, created: Date.now() });
  saveNotes(notes);
  inputEl.value = '';
  render();
});

$('deleteAllBtn').addEventListener('click', () => {
  if (loadNotes().length === 0) return;
  if (confirm('Sigurado ka bang burahin LAHAT ng notes? Hindi na ito mababawi.')) {
    saveNotes([]);
    render();
  }
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    $('addBtn').click();
  }
});

render();
</script>
</body>
</html>
